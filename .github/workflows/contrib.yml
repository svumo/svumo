name: Contribution graph

# Alternates the single contrib slot between:
#   - Platane/snk    (flat animated snake, teal palette)
#   - yoshi389111/github-profile-3d-contrib  (3D isometric bars)
# Decided each run by `github.run_number % 2`.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      style:
        description: "Override style (auto = alternate by date)"
        required: false
        default: auto
        type: choice
        options: [auto, snake, "3d"]
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  contrib:
    runs-on: ubuntu-latest
    steps:
      - name: Decide style
        id: pick
        run: |
          OVERRIDE="${{ inputs.style }}"
          if [ "$OVERRIDE" = "snake" ] || [ "$OVERRIDE" = "3d" ]; then
            STYLE="$OVERRIDE"
            echo "Override: $STYLE"
          else
            DAY=$(date +%d | sed 's/^0//')
            if [ $(( DAY % 2 )) -eq 0 ]; then STYLE=snake; else STYLE=3d; fi
            echo "Auto (day $DAY): $STYLE"
          fi
          echo "style=$STYLE" >> "$GITHUB_OUTPUT"
          [ "$STYLE" = "snake" ] && echo "🐍 SNAKE this run" || echo "🧊 3D this run"

      - name: Prep dist
        run: mkdir -p dist

      # ------------------------- SNAKE -------------------------
      - name: Generate snake
        if: steps.pick.outputs.style == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: svumo
          outputs: |
            dist/contrib.svg?color_snake=%2314b8a6&color_dots=%230d0d0d,%23042f2a,%230a7068,%230f9d8f,%2314b8a6

      # ------------------------ 3D BARS ------------------------
      - name: Checkout (for 3D action)
        if: steps.pick.outputs.style == '3d'
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        if: steps.pick.outputs.style == '3d'
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: svumo

      - name: Move 3D output into dist
        if: steps.pick.outputs.style == '3d'
        run: |
          set -e
          mkdir -p dist
          echo "Workspace svgs:"; find . -maxdepth 3 -name '*.svg' -not -path './dist/*' -not -path './.git/*' | head
          # Prefer a dark/green variant if produced, otherwise take any svg the action made
          for cand in \
            profile-3d-contrib/profile-green-animate.svg \
            profile-3d-contrib/profile-south-season-animate.svg \
            profile-3d-contrib/profile-night-green.svg \
            profile-3d-contrib/profile-night-view.svg \
            profile-3d-contrib.svg ; do
            if [ -f "$cand" ]; then cp "$cand" dist/contrib.svg; echo "picked: $cand"; break; fi
          done
          # Fallback: any .svg under profile-3d-contrib/, then any in repo root
          if [ ! -f dist/contrib.svg ]; then
            first=$(find profile-3d-contrib -maxdepth 1 -name '*.svg' 2>/dev/null | head -1)
            [ -n "$first" ] && cp "$first" dist/contrib.svg && echo "picked fallback: $first"
          fi
          if [ ! -f dist/contrib.svg ]; then
            first=$(find . -maxdepth 1 -name '*.svg' 2>/dev/null | head -1)
            [ -n "$first" ] && cp "$first" dist/contrib.svg && echo "picked root fallback: $first"
          fi
          [ -f dist/contrib.svg ] || { echo "::error::no svg produced by 3D action"; exit 1; }
          ls -la dist

      # ---------------------- COMMIT COUNTS ----------------------
      # One-line SVG: commits this year and all time. Private commits are
      # included via restrictedContributionsCount (public on this profile).
      - name: Commit counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          Q='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){totalCommitContributions restrictedContributionsCount contributionYears}}}'
          count() {
            gh api graphql -f query="$Q" -F login=svumo -F from="$1-01-01T00:00:00Z" -F to="$1-12-31T23:59:59Z" \
              --jq '.data.user.contributionsCollection | .totalCommitContributions + .restrictedContributionsCount'
          }
          YEAR=$(date -u +%Y)
          YEARS=$(gh api graphql -f query="$Q" -F login=svumo -F from="$YEAR-01-01T00:00:00Z" -F to="$YEAR-12-31T23:59:59Z" \
            --jq '.data.user.contributionsCollection.contributionYears[]')
          THIS=$(count "$YEAR"); ALL=0
          for y in $YEARS; do ALL=$(( ALL + $(count "$y") )); done
          fmt() { echo "$1" | sed -e ':a' -e 's/\B[0-9]\{3\}\>/,&/' -e 'ta'; }
          THIS_F=$(fmt "$THIS"); ALL_F=$(fmt "$ALL")
          echo "this year: $THIS_F, all time: $ALL_F"
          cat > dist/commits.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="560" height="36" viewBox="0 0 560 36" role="img" aria-label="$THIS_F commits in $YEAR, $ALL_F all time">
          <text x="280" y="23" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" fill="#8b949e"><tspan fill="#14b8a6" font-weight="700">$THIS_F</tspan> commits in $YEAR<tspan dx="14" fill="#6e7681">·</tspan><tspan dx="14" fill="#14b8a6" font-weight="700">$ALL_F</tspan> all time</text>
          </svg>
          SVG

      # ------------------------ PUBLISH ------------------------
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
