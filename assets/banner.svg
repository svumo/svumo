<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="svumo (Daniel). Cybersecurity, offensive and defensive, identity and access management, and full-stack builds. Still learning." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<style>
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.orb{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-18px)}}
@media (prefers-reduced-motion:reduce){.l,.cur,.orb{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#14b8a6" stop-opacity=".45"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#7c3aed" stop-opacity=".38"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="o3"><stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".06"/></pattern>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<clipPath id="card"><rect width="1200" height="320" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#dots)"/>
<circle class="orb" cx="170" cy="250" r="260" fill="url(#o1)"/>
<circle class="orb" cx="1080" cy="40" r="300" fill="url(#o2)" style="animation-direction:alternate-reverse"/>
<circle cx="640" cy="330" r="220" fill="url(#o3)"/>
<rect x="0" y="316" width="1200" height="4" fill="url(#edge)"/>
</g>
<text x="76" y="178" font-size="112" font-weight="800" letter-spacing="-4" fill="#f1f5f9"><tspan fill="#14b8a6">s</tspan>vumo</text>
<text x="80" y="226" font-size="26" fill="#cbd5e1">Daniel · security · identity · builds things</text>
<g transform="translate(80 252)" font-size="15" font-weight="600">
<rect width="126" height="30" rx="15" fill="#14b8a6" fill-opacity=".14" stroke="#14b8a6" stroke-opacity=".5"/><text x="63" y="20" text-anchor="middle" fill="#5eead4">offense</text>
<rect x="136" width="126" height="30" rx="15" fill="#7c3aed" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".5"/><text x="199" y="20" text-anchor="middle" fill="#a78bfa">defense</text>
<rect x="272" width="126" height="30" rx="15" fill="#fbbf24" fill-opacity=".10" stroke="#fbbf24" stroke-opacity=".45"/><text x="335" y="20" text-anchor="middle" fill="#fbbf24">identity</text>
</g>
<g>
<rect x="652" y="44" width="500" height="240" rx="16" fill="#0b1220" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".08"/>
<circle cx="676" cy="68" r="6" fill="#ff5f57"/><circle cx="696" cy="68" r="6" fill="#febc2e"/><circle cx="716" cy="68" r="6" fill="#28c840"/>
<text x="1128" y="73" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#94a3b8">~/svumo</text>
<line x1="652" y1="88" x2="1152" y2="88" stroke="#ffffff" stroke-opacity=".06"/>
<g class="l" style="animation-delay:0.25s"><text x="676" y="128" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17"><tspan fill="#14b8a6">$</tspan><tspan dx="10" fill="#5eead4">whoami</tspan></text></g><g class="l" style="animation-delay:0.47s"><text x="676" y="157" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17"><tspan fill="#a78bfa">></tspan><tspan dx="10" fill="#cbd5e1">cybersecurity · offense + defense</tspan></text></g><g class="l" style="animation-delay:0.69s"><text x="676" y="186" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17"><tspan fill="#a78bfa">></tspan><tspan dx="10" fill="#cbd5e1">identity &amp; access management</tspan></text></g><g class="l" style="animation-delay:0.91s"><text x="676" y="215" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17"><tspan fill="#a78bfa">></tspan><tspan dx="10" fill="#cbd5e1">full-stack when a project needs it</tspan></text></g><g class="l" style="animation-delay:1.13s"><text x="676" y="244" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17"><tspan fill="#14b8a6">$</tspan><tspan dx="10" fill="#5eead4">status</tspan></text></g><g class="l" style="animation-delay:1.35s"><text x="676" y="273" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17"><tspan fill="#a78bfa">&gt;</tspan><tspan dx="10" fill="#fbbf24">still learning</tspan></text><rect class="cur" x="849.2" y="258" width="10" height="19" rx="2" fill="#5eead4"/></g>
